[project]
name = "lluminous-quill"
version = "0.1.0"
description = "Portable, security-first AI agent workspace"
requires-python = ">=3.11"
dependencies = ["pywebview>=5.4,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
